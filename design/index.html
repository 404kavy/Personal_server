<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Server - Figma Design Preview</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background-color: #1e293b;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
    }
    .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .badge {
      background: #3b82f6;
      color: white;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    h1 {
      font-size: 16px;
      font-weight: 600;
      color: #f1f5f9;
    }
    .actions {
      display: flex;
      gap: 12px;
    }
    a.btn {
      display: inline-flex;
      align-items: center;
      padding: 6px 14px;
      border-radius: 6px;
      background: #2563eb;
      color: #ffffff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.2s ease;
    }
    a.btn:hover {
      background: #1d4ed8;
    }
    .iframe-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="title-group">
      <span class="badge">Figma Embed</span>
      <h1>Dashboard & UI Wireframes</h1>
    </div>
    <div class="actions">
      <a class="btn" href="https://www.figma.com/design/95wBj4ZrjOIVY1L9mECfqO/Untitled?node-id=2-350" target="_blank" rel="noopener noreferrer">
        Open in Figma App ↗
      </a>
    </div>
  </header>
  <div class="iframe-container">
    <iframe
      src="https://embed.figma.com/design/95wBj4ZrjOIVY1L9mECfqO/Untitled?node-id=2-350&embed-host=share"
      allowfullscreen>
    </iframe>
  </div>
</body>
</html>
